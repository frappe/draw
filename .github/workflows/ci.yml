name: CI

# Runs on every pull request into main, and on pushes to main itself, so a
# change can't reach main without the frontend building and all unit tests
# passing. Pair this with a branch-protection "required status check" on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Before the tests: an undefined identifier inside <script setup> is valid
      # JavaScript that only throws when the component mounts, so neither the
      # build nor the browser-free unit tests catch it (#367).
      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build

  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host localhost --user root --password=root"
          --health-interval=5s --health-timeout=2s --health-retries=15
      redis-cache:
        image: redis:6.2-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:6.2-alpine
        ports:
          - 11000:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install bench + create test site
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh

      - name: Run server tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app draw

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Not a required check yet: it boots a full bench and drives a browser, so it is
    # the most fragile job here. Promote it in branch protection once it has proven
    # itself over a few runs.
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host localhost --user root --password=root"
          --health-interval=5s --health-timeout=2s --health-retries=15
      redis-cache:
        image: redis:6.2-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:6.2-alpine
        ports:
          - 11000:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install bench + create test site
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh

      - name: Install E2E dependencies
        run: |
          yarn install --frozen-lockfile
          # Chromium rather than the config's default installed Chrome, which a
          # runner does not have.
          npx playwright install --with-deps chromium

      - name: Point test_site at localhost
        # Frappe resolves the site from the Host header and answers 404 when no site
        # matches — which is what `http://localhost:8000` did, so even /api/method/login
        # 404'd. Map the site name to the loopback and address the site by name.
        run: |
          echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts
          cd /home/runner/frappe-bench && bench use test_site

      - name: Build the SPA inside the bench
        working-directory: /home/runner/frappe-bench
        # install.sh runs `bench get-app draw <workspace>`, which COPIES the checkout
        # into apps/draw, and `bench init --skip-assets` builds nothing — so a build in
        # the workspace would never reach the app that gets served. Build in the bench.
        run: bench build --app draw

      - name: Start bench
        working-directory: /home/runner/frappe-bench
        run: |
          # Full `bench start` (not just `bench serve`) so socketio is up too: the
          # specs assert that no request fails, and a missing realtime endpoint shows
          # up as exactly that kind of noise.
          nohup bench start > /home/runner/bench-start.log 2>&1 &
          # Addressed by site NAME so the Host header resolves the site (see the
          # /etc/hosts step). Any HTTP response means the server is listening — don't
          # require a specific status, since an unauthenticated request to a
          # whitelisted method can legitimately answer 403 and that still means "up".
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://test_site:8000/draw || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "bench up after ${i}s (HTTP $code)"; exit 0
            fi
            sleep 1
          done
          echo "bench did not come up in 120s"; tail -80 /home/runner/bench-start.log; exit 1

      - name: Run E2E tests
        env:
          DRAW_BASE_URL: http://test_site:8000
          DRAW_USER: Administrator
          DRAW_PASSWORD: admin
          PLAYWRIGHT_CHANNEL: chromium
        run: yarn test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Bench log on failure
        if: failure()
        run: tail -100 /home/runner/bench-start.log || true
